<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Kino Glow</title>
    <!-- Telegram Web App SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="stylesheet" href="styles.css">
    <!-- Google Fonts for premium typography -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800&display=swap" rel="stylesheet">
</head>
<body>
    <!-- Koinot Foni -->
    <div id="space-background">
        <div class="stars"></div>
        <div class="twinkling"></div>
        <div class="moon"></div>
        <div class="satellite"></div>
    </div>

    <!-- Ilova Qobiqi -->
    <div id="app-container">
        
        <!-- Yuqori panel: Sarlavha -->
        <header>
            <h1 class="glow-text">Kino Glow</h1>
        </header>

        <!-- Asosiy kontent joyi -->
        <main id="main-content">
            <!-- Bu yer javascript orqali to'ldiriladi -->
        </main>

        <!-- Pastki menyu (Tabs) -->
        <nav class="bottom-nav">
            <button class="nav-item active" onclick="switchTab('kino')" id="nav-kino">🎬 Kino</button>
            <button class="nav-item" onclick="switchTab('serial')" id="nav-serial">📺 Serial</button>
            <button class="nav-item" onclick="switchTab('musiqa')" id="nav-musiqa">🎵 Musiqa</button>
            <button class="nav-item" onclick="switchTab('saqlanganlar')" id="nav-saq">❤️ Saqlanganlar</button>
            <button class="nav-item vip-btn" onclick="switchTab('vip')" id="nav-vip">⭐ VIP</button>
            <button class="nav-item" onclick="switchTab('profil')" id="nav-profil">👤 Profil</button>
        </nav>
    </div>

    <!-- Admin tugmasi faqat adminlar uchun ko'rinadi -->
    <button id="admin-btn" style="display:none; position:fixed; bottom:80px; right:15px; z-index:999; background:linear-gradient(45deg,#bd00ff,#ff6600); color:white; border:none; padding:10px 18px; border-radius:25px; font-weight:bold; font-size:13px; box-shadow:0 0 20px rgba(189,0,255,0.6); cursor:pointer;" onclick="switchTab('admin')">⚙️ Admin</button><button id="admin-btn" style="display:none; position:fixed; bottom:80px; right:15px; z-index:999; background:linear-gradient(45deg,#bd00ff,#ff6600); color:white; border:none; padding:10px 18px; border-radius:25px; font-weight:bold; font-size:13px; box-shadow:0 0 20px rgba(189,0,255,0.6); cursor:pointer;" onclick="switchTab('admin')">⚙️ Admin</button>

    <script src="script.js"></script>
</body>
</html>
